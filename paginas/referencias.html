<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Referências integradas | Humanidades Digitais no Mundo Atlântico</title>
</head>
<body>
  <p>As referências foram integradas à página <a href="parceiros.html?lang=pt#referencias">Parceiros, Sites Institucionais e Referências</a>.</p>
  <script>
    const destination = new URL("parceiros.html", window.location.href);
    const language = new URLSearchParams(window.location.search).get("lang");
    destination.searchParams.set("lang", ["pt", "en", "es"].includes(language) ? language : "pt");
    destination.hash = "referencias";
    window.location.replace(destination.href);
  </script>
</body>
</html>
